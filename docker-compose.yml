services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - LLM_BASE_URL=http://llama-server:8080/v1
      - DB_PATH=/app/data/cache.db
    volumes:
      - ./server/data:/app/data
    depends_on:
      - llama-server

  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-server
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
    command: >
      -m /models/gemma-4-E2B-it-Q4_K_M.gguf
      --host 0.0.0.0
      --port 8080
      -ngl 99
      --ctx-size 4096
      --repeat-penalty 1.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]